[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gods-eye"
version = "1.0.0b1"  # public tag: v1.0.0-beta.1
description = "Tellurion: open-source, local-first world intelligence. A globe you can interrogate: sensor plugins, evidence trails, entity graph, and a time machine."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["world-intelligence", "osint", "geospatial", "situational-awareness",
            "globe", "maplibre", "real-time", "public-data", "data-fusion",
            "event-monitoring", "change-detection", "aviation", "weather",
            "earthquakes", "ai-agent", "command-center", "plugins"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
# The core runs on the Python standard library only.
dependencies = []

[project.optional-dependencies]
capture = ["playwright>=1.50"]
dev = ["pytest>=8.3"]

[project.scripts]
# Public brand and the historical command; both run the same CLI.
tellurion = "gods_eye.cli:main"
godseye = "gods_eye.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["gods_eye*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests", "plugins", "examples"]
