name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, no secrets)
        run: pip install -e ".[dev]"
      - name: Doctor
        run: godseye doctor
      - name: Tests (core, plugins, examples)
        run: python -m pytest tests plugins examples -q -p no:cacheprovider
      - name: Demo API smoke (localhost)
        run: python scripts/smoke_demo_api.py
      - name: Standalone install verification
        run: python scripts/verify_install.py
      - name: Asset rights manifest is current
        run: python scripts/update_asset_rights.py --check
      - name: Release check (read-only, never publishes)
        run: godseye release-check

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
